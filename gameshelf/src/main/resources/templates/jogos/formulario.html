<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de jogo | GameShelf</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="topo">
        <a class="marca" th:href="@{/jogos}">🎮 GameShelf</a>
    </header>

    <main class="container">
        <section class="painel">
            <h1
                th:text="${jogo.id == null ? 'Cadastrar jogo' : 'Editar jogo'}">
                Cadastrar jogo
            </h1>

            <p class="subtitulo">
                Adicione um título à sua coleção.
            </p>

            <form
                th:action="@{/jogos/salvar}"
                th:object="${jogo}"
                method="post">

                <input type="hidden" th:field="*{id}">

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input
                        id="titulo"
                        type="text"
                        th:field="*{titulo}"
                        placeholder="Ex.: Hollow Knight">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('titulo')}"
                        th:errors="*{titulo}">
                    </small>
                </div>

                <div class="campo">
                    <label for="desenvolvedora">Desenvolvedora</label>
                    <input
                        id="desenvolvedora"
                        type="text"
                        th:field="*{desenvolvedora}"
                        placeholder="Ex.: Team Cherry">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('desenvolvedora')}"
                        th:errors="*{desenvolvedora}">
                    </small>
                </div>

                <div class="campo">
                    <label for="plataforma">Plataforma</label>
                    <input
                        id="plataforma"
                        type="text"
                        th:field="*{plataforma}"
                        placeholder="Ex.: PC, PlayStation, Xbox">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('plataforma')}"
                        th:errors="*{plataforma}">
                    </small>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input
                        id="genero"
                        type="text"
                        th:field="*{genero}"
                        placeholder="Ex.: Metroidvania">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('genero')}"
                        th:errors="*{genero}">
                    </small>
                </div>

                <div class="campo">
                    <label for="anoLancamento">Ano de lançamento</label>
                    <input
                        id="anoLancamento"
                        type="number"
                        min="1950"
                        max="2100"
                        th:field="*{anoLancamento}">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('anoLancamento')}"
                        th:errors="*{anoLancamento}">
                    </small>
                </div>

                <div class="campo">
                    <label for="nota">Nota (0 a 10)</label>
                    <input
                        id="nota"
                        type="number"
                        min="0"
                        max="10"
                        step="0.1"
                        th:field="*{nota}">

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('nota')}"
                        th:errors="*{nota}">
                    </small>
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}">
                        <option value="">Selecione</option>
                        <option value="Na fila">Na fila</option>
                        <option value="Jogando">Jogando</option>
                        <option value="Zerado">Zerado</option>
                        <option value="Abandonado">Abandonado</option>
                    </select>

                    <small
                        class="erro"
                        th:if="${#fields.hasErrors('status')}"
                        th:errors="*{status}">
                    </small>
                </div>

                <div class="acoes">
                    <button class="botao" type="submit">Salvar jogo</button>
                    <a class="botao secundario" th:href="@{/jogos}">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
